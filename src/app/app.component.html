<div style="
  min-height: 100vh;
  background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  display: flex;
  justify-content: center;
  align-items: center;
">

  <div style="
    max-width: 500px;
    width: 100%;
    padding: 2rem;
    background: rgba(255,255,255,0.95);
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    text-align: center;
  ">

    <h2>Text Sentiment Analysis</h2>
    <h3>~@ NEW VERSION</h3>

    <textarea
      [(ngModel)]="text"
      rows="5"
      placeholder="Enter: e.g. I love this product!"
      style="
        width: 100%;
        padding: 1rem;
        background-color: #fff8dc;
        color: #1a237e;
        border: 1px solid #d6c28a;
        border-radius: 8px;
        font-size: 1rem;
      "
    ></textarea>

    <br><br>

    <button (click)="submit()">Analyze</button>

    <div *ngIf="result" style="margin-top: 1rem; color: #444;">
      <p><strong>Sentiment:</strong> {{ result }}</p>
      <p><strong>Confidence:</strong> {{ confidence }}</p>
    </div>

  </div>
</div>
